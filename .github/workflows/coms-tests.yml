name: COMS acceptance

# Every push and every PR. The suite is hermetic: it starts its own mosquitto on
# 127.0.0.1, uses a throwaway HOME, and clears the topics it writes, so it never
# touches the production bus at 192.168.2.52.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  coms-linux:
    name: acceptance suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install mosquitto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients

      - name: Start a local broker
        run: |
          mosquitto -d -p 1883
          for i in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then
              echo "broker up after ${i} attempt(s)"
              exit 0
            fi
            sleep 0.5
          done
          echo "broker never came up" >&2
          exit 1

      - name: Syntax check the client
        run: |
          bash -n COMMUNICATION/coms
          python3 -m py_compile COMMUNICATION/dedupe_roster.py

      - name: Acceptance suite
        env:
          COMS_BROKER: 127.0.0.1
          COMS_PORT: "1883"
        run: bash COMMUNICATION/test_coms_linux.sh

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coms-acceptance-transcript
          path: |
            COMMUNICATION/test_coms_linux.sh
          if-no-files-found: ignore

  # The Linux suite cannot prove the Windows client works, and the 500 KB path
  # spent months as a SKIP here. This job runs the real verifier on a real
  # Windows PowerShell 5.1 against a broker on 127.0.0.1, then fails the build
  # unless the byte count came back whole and nothing was skipped.
  coms-windows:
    name: bundled transport + 500 KB
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the bundled transport (paho)
        run: python -m pip install --quiet --disable-pip-version-check paho-mqtt

      - name: Install and start a broker
        shell: pwsh
        run: |
          # `choco install mosquitto` exits 0 but leaves no binary here (measured
          # 2026-11-20), so use the official installer mosquitto.org publishes and
          # pick whichever version the index currently offers.
          $idx = (Invoke-WebRequest -UseBasicParsing "https://mosquitto.org/files/binary/win64/").Content
          $names = [regex]::Matches($idx, "mosquitto-[0-9.]+-install-windows-x64\.exe") |
                   ForEach-Object { $_.Value } | Sort-Object -Unique
          if (-not $names) { throw "no mosquitto installer listed in the win64 index" }
          $newest = $names |
                    Sort-Object { [version](($_ -replace "^mosquitto-", "") -replace "-.*$", "") } |
                    Select-Object -Last 1
          $url = "https://mosquitto.org/files/binary/win64/$newest"
          Write-Host "installing $url"
          $setup = Join-Path $env:TEMP $newest
          Invoke-WebRequest -UseBasicParsing $url -OutFile $setup
          Start-Process $setup -ArgumentList "/S" -Wait
          $broker = "C:\Program Files\mosquitto\mosquitto.exe"
          if (-not (Test-Path $broker)) {
            # NSIS versus Inno silent switches; try the other one before giving up.
            Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          }
          if (-not (Test-Path $broker)) { throw "mosquitto not found at $broker after install" }
          function Test-Broker {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $c = New-Object Net.Sockets.TcpClient
                $c.Connect("127.0.0.1", 1883)
                $c.Close()
                return $true
              } catch { Start-Sleep -Milliseconds 500 }
            }
            return $false
          }
          if (-not (Test-Broker)) {
            Start-Process $broker -ArgumentList "-p", "1883"
            if (-not (Test-Broker)) { throw "broker never came up on 127.0.0.1:1883" }
          }
          Write-Host "broker listening on 127.0.0.1:1883"

      - name: Seed a clean roster so the upsert test runs instead of skipping
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE ".coms"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @(
            '{"host":"ci-runner","worktree":"ci-wt","agent":"ci-agent-a","registered_at":"2026-11-20T00:00:00Z"}',
            '{"host":"ci-runner","worktree":"ci-wt","agent":"ci-agent-b","registered_at":"2026-11-20T00:00:00Z"}'
          ) | Set-Content -Path (Join-Path $dir "agents.jsonl") -Encoding ASCII

      - name: Verify the Windows client
        shell: pwsh
        run: |
          $log = "verify-windows.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File COMMUNICATION\verify_coms_windows.ps1 `
            -Agent ci-agent-a -Coms "$PWD\COMMUNICATION\coms.ps1" -Broker 127.0.0.1 -Port 1883 2>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "verify_coms_windows.ps1 exited $code" }
          $t = Get-Content $log -Raw
          if ($t -notmatch "500 KB arrives whole -- published 500000 of 500000 bytes") { throw "the 500 KB payload was not proven whole" }
          if ($t -match "\[SKIP\]") {
            throw ("a test was skipped: " + (($t -split "`n" | Select-String '\[SKIP\]') -join "; "))
          }
          $pass = ([regex]::Matches($t, "\[PASS\]")).Count
          Write-Host "$pass checks passed, none skipped"

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coms-windows-transcript
          path: verify-windows.log
          if-no-files-found: ignore
